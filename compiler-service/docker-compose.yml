services:
  compiler:
    build: .
    ports:
      - "2000:2000"
    environment:
      ALLOWED_ORIGIN: "*"   # replace with your Firebase site URL in production
    read_only: true
    tmpfs:
      - /tmp:size=64m,exec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
